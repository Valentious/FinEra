# FinEra - single browser port (default 8080). API + DB + broker internal; no host ports for backend/DB/Rabbit.
# Run: docker compose up -d --build
# Admin + member app: http://localhost:8080  -  Admin: http://localhost:8080/admin

version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: finera-postgres
    environment:
      POSTGRES_USER: finera
      POSTGRES_PASSWORD: finera_secure
      POSTGRES_DB: finera_db
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finera"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: finera-rabbitmq
    hostname: rabbitmq
    expose:
      - "5672"
      - "15672"
    environment:
      RABBITMQ_DEFAULT_USER: finera
      RABBITMQ_DEFAULT_PASS: finera_rabbit_secure
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: finera-backend
    environment:
      DATABASE_URL: postgresql://finera:finera_secure@postgres:5432/finera_db
      RABBITMQ_URL: amqp://finera:finera_rabbit_secure@rabbitmq:5672
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: docker-dev-jwt-secret-min-32-characters-required
      JWT_REFRESH_SECRET: docker-dev-refresh-secret-min-32-chars-required
      FRONTEND_URL: http://localhost:8080
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api/v1
    container_name: finera-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    environment: {}

volumes:
  postgres_data:
  rabbitmq_data:
