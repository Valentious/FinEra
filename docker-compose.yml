# FinEra Inclusive Credit - Full Stack
# Run: docker-compose up -d
# Dev: npm run dev (concurrently frontend + backend)

version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: finera-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finera_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: finera-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/finera_db
      NODE_ENV: production
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: finera-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000/api/v1

volumes:
  postgres_data:
