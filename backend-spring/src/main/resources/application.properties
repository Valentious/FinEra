# Server
server.port=8080

# --- OTP email (Gmail SMTP) — use an App Password, not your normal Gmail password ---
otp.mail.host=smtp.gmail.com
otp.mail.port=587
otp.mail.username=your.address@gmail.com
otp.mail.password=your-app-password
otp.mail.from=your.address@gmail.com

# --- OTP SMS (Twilio Verify) — recipient must be E.164 when type=sms ---
# Service SID from Twilio Console → Verify → Services (starts with VA)
otp.twilio.account-sid=
otp.twilio.auth-token=
otp.twilio.verify-service-sid=
