# FinEra Backend - Local Development Stack
# Run: docker compose up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: finera-postgres
    environment:
      POSTGRES_USER: finera
      POSTGRES_PASSWORD: finera_secure
      POSTGRES_DB: finera_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finera -d finera_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finera-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
